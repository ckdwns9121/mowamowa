<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">

  <g id="Body_Feet_Tail">
    <!-- Tail (peeking on the right) -->
    <g id="Tail">
      <path d="M 285,320 C 315,310 330,335 315,355 C 300,365 285,350 280,335 Z" 
            fill="#231F20" stroke="#1A1819" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Torso / Lower Body -->
    <g id="Torso">
      <path d="M 130,285 
               C 120,310 125,355 145,370 
               C 165,378 235,378 255,370 
               C 275,355 280,310 270,285 Z" 
            fill="#FFF6DE" stroke="#231F20" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Feet (Black otter paws) -->
    <g id="Feet">
      <!-- Left Foot -->
      <ellipse cx="160" cy="378" rx="16" ry="10" fill="#231F20" stroke="#1A1819" stroke-width="2.5"/>
      <line x1="155" y1="384" x2="155" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <line x1="163" y1="384" x2="163" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <!-- Right Foot -->
      <ellipse cx="240" cy="378" rx="16" ry="10" fill="#231F20" stroke="#1A1819" stroke-width="2.5"/>
      <line x1="235" y1="384" x2="235" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <line x1="243" y1="384" x2="243" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

</svg>
