<?xml version="1.0" encoding="UTF-8"?>
<!--
  Chiikawa Rakko (랏코 선생) Rive Rigging Master Artboard
  - Optimized for Rive (rive.app) & Figma Import
  - ViewBox: 0 0 400 400
  - Grouped into semantic, riggable layers with distinct IDs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="Rakko_Root" filter="url(#soft-shadow)">
    <!-- 1. Weapon Layer (Back) -->
    
  <g id="Greatsword">
    <!-- Greatsword Blade (Behind back & peeking over shoulder) -->
    <g id="Sword_Blade">
      <path d="M 75,130 L 115,220 L 98,228 L 58,138 Z" fill="#E2E8F0" stroke="#231F20" stroke-width="3" stroke-linejoin="round"/>
      <!-- Blade tip and fuller groove -->
      <polygon points="58,138 75,130 68,110" fill="#CBD5E1" stroke="#231F20" stroke-width="3" stroke-linejoin="round"/>
      <line x1="72" y1="140" x2="98" y2="210" stroke="#94A3B8" stroke-width="2"/>
    </g>
    <!-- Guard -->
    <rect x="90" y="218" width="32" height="8" rx="3" fill="#F59E0B" stroke="#231F20" stroke-width="2.5" transform="rotate(25 106 222)"/>
    <!-- Hilt / Handle -->
    <rect x="106" y="226" width="9" height="26" rx="2" fill="#78350F" stroke="#231F20" stroke-width="2.5" transform="rotate(25 110 239)"/>
    <!-- Pommel -->
    <circle cx="122" cy="258" r="6" fill="#F59E0B" stroke="#231F20" stroke-width="2.5"/>
  </g>


    <!-- 2. Lower Body & Tail Layer -->
    
  <g id="Body_Feet_Tail">
    <!-- Tail (peeking on the right) -->
    <g id="Tail">
      <path d="M 285,320 C 315,310 330,335 315,355 C 300,365 285,350 280,335 Z" 
            fill="#231F20" stroke="#1A1819" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Torso / Lower Body -->
    <g id="Torso">
      <path d="M 130,285 
               C 120,310 125,355 145,370 
               C 165,378 235,378 255,370 
               C 275,355 280,310 270,285 Z" 
            fill="#FFF6DE" stroke="#231F20" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Feet (Black otter paws) -->
    <g id="Feet">
      <!-- Left Foot -->
      <ellipse cx="160" cy="378" rx="16" ry="10" fill="#231F20" stroke="#1A1819" stroke-width="2.5"/>
      <line x1="155" y1="384" x2="155" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <line x1="163" y1="384" x2="163" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <!-- Right Foot -->
      <ellipse cx="240" cy="378" rx="16" ry="10" fill="#231F20" stroke="#1A1819" stroke-width="2.5"/>
      <line x1="235" y1="384" x2="235" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <line x1="243" y1="384" x2="243" y2="388" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>


    <!-- 3. Cape Layer (Middle) -->
    
  <g id="Cape">
    <!-- Cape folds & main volume wrapped under chin -->
    <path d="M 115,220 
             C 125,212 155,210 200,210 
             C 245,210 275,212 285,220 
             C 305,235 320,265 310,290 
             C 295,305 260,312 200,312 
             C 140,312 105,305 90,290 
             C 80,265 95,235 115,220 Z" 
          fill="#FFFFFF" stroke="#231F20" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Cape interior knot / neck scarf wrap creases -->
    <path d="M 145,225 C 170,240 230,240 255,225" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <path d="M 160,250 C 180,265 220,265 240,250" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 185,235 Q 200,265 215,235" fill="none" stroke="#231F20" stroke-width="3" stroke-linecap="round"/>
  </g>


    <!-- 4. Front Paws Layer -->
    
  <g id="Arms_Paws">
    <!-- Left Paw -->
    <g id="Paw_Left">
      <path d="M 125,270 C 135,260 155,275 145,295 C 135,305 115,290 125,270 Z" 
            fill="#231F20" stroke="#1A1819" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="136" cy="282" r="3" fill="#374151"/>
    </g>
    <!-- Right Paw -->
    <g id="Paw_Right">
      <path d="M 275,270 C 265,260 245,275 255,295 C 265,305 285,290 275,270 Z" 
            fill="#231F20" stroke="#1A1819" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="264" cy="282" r="3" fill="#374151"/>
    </g>
  </g>


    <!-- 5. Head Rig Layer (Top) -->
    <g id="Head_Group">
      
  <g id="Ears">
    <!-- Left Ear (Viewer's left) -->
    <g id="Ear_Left">
      <path d="M 125,75 C 110,65 95,85 105,108 C 112,122 128,125 135,112 Z" fill="#231F20" stroke="#1A1819" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="118" cy="92" rx="7" ry="12" fill="#1A1819" opacity="0.4" transform="rotate(-20 118 92)"/>
    </g>
    <!-- Right Ear (Viewer's right) -->
    <g id="Ear_Right">
      <path d="M 275,75 C 290,65 305,85 295,108 C 288,122 272,125 265,112 Z" fill="#231F20" stroke="#1A1819" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="282" cy="92" rx="7" ry="12" fill="#1A1819" opacity="0.4" transform="rotate(20 282 92)"/>
    </g>
  </g>

      
  <g id="Head_Base">
    <!-- Head Outline and Fluffy Cream Fur -->
    <path d="M 130,105 
             C 145,82 175,72 200,72 
             C 225,72 255,82 270,105 
             C 290,122 308,148 305,178 
             C 304,188 312,192 310,202 
             C 308,212 296,218 290,224 
             C 265,248 238,252 200,252 
             C 162,252 135,248 110,224 
             C 104,218 92,212 90,202 
             C 88,192 96,188 95,178 
             C 92,148 110,122 130,105 Z" 
          fill="#FFF6DE" stroke="#231F20" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Cheek fluff spikes (Left) -->
    <path d="M 94,182 Q 82,190 92,198" fill="none" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 91,202 Q 80,210 93,216" fill="none" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Cheek fluff spikes (Right) -->
    <path d="M 306,182 Q 318,190 308,198" fill="none" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 309,202 Q 320,210 307,216" fill="none" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
  </g>

      
  <g id="Eyes">
    <!-- Left Eye (Viewer's left) -->
    <g id="Eye_Left">
      <ellipse cx="162" cy="165" rx="8" ry="10" fill="#231F20"/>
      <circle cx="159" cy="161" r="3" fill="#FFFFFF"/>
    </g>
    <!-- Right Eye (Viewer's right) -->
    <g id="Eye_Right">
      <ellipse cx="238" cy="165" rx="8" ry="10" fill="#231F20"/>
      <circle cx="235" cy="161" r="3" fill="#FFFFFF"/>
    </g>
  </g>

      
  <g id="Face_Details">
    <!-- Determined Eyebrows / Furrow Lines -->
    <g id="Eyebrows">
      <path d="M 148,145 Q 162,150 172,146" fill="none" stroke="#231F20" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 252,145 Q 238,150 228,146" fill="none" stroke="#231F20" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Brow concentration creases -->
      <path d="M 188,144 Q 192,140 196,144" fill="none" stroke="#231F20" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 204,144 Q 208,140 212,144" fill="none" stroke="#231F20" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Signature Cross Scar (Above and beside right eye) -->
    <g id="Scar">
      <line x1="248" y1="135" x2="256" y2="151" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="242" y1="143" x2="262" y2="143" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Nose and Otter 'w' Mouth -->
    <g id="Nose_Mouth">
      <!-- Tiny Dot Nose -->
      <ellipse cx="200" cy="176" rx="3.5" ry="2.5" fill="#231F20"/>
      <!-- 'w' Shaped Mouth -->
      <path d="M 188,185 C 190,192 198,193 200,187 C 202,193 210,192 212,185" 
            fill="none" stroke="#231F20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Pink Cheek Blushes (/// marks) -->
    <g id="Blush">
      <!-- Left Cheek -->
      <line x1="138" y1="182" x2="142" y2="190" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="144" y1="181" x2="148" y2="189" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="150" y1="182" x2="154" y2="190" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Right Cheek -->
      <line x1="246" y1="182" x2="250" y2="190" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="252" y1="181" x2="256" y2="189" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="258" y1="182" x2="262" y2="190" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

    </g>

    <!-- 6. Prop Layer (Break Mode Item) -->
    
  <g id="Strawberry_Parfait">
    <!-- Parfait Glass -->
    <path d="M 235,260 L 265,260 L 258,295 L 254,310 L 262,312 L 238,312 L 246,310 L 242,295 Z" 
          fill="#E0F2FE" fill-opacity="0.75" stroke="#0284C7" stroke-width="2" stroke-linejoin="round"/>
    <!-- Parfait cream & syrup layers -->
    <ellipse cx="250" cy="265" rx="14" ry="4" fill="#FFFFFF"/>
    <ellipse cx="250" cy="275" rx="11" ry="3" fill="#FB7185"/>
    <ellipse cx="250" cy="285" rx="9" ry="3" fill="#FEF08A"/>
    <!-- Whipped Cream Swirl -->
    <path d="M 240,260 Q 250,245 260,260 Q 250,252 240,260 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Fresh Strawberry on top -->
    <path d="M 246,242 C 243,246 244,254 250,256 C 256,254 257,246 254,242 Z" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <!-- Strawberry leaf -->
    <polygon points="250,242 248,239 252,239" fill="#22C55E"/>
    <!-- Tiny Spoon -->
    <line x1="262" y1="245" x2="252" y2="285" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  </g>
</svg>
